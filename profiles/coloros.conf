# ============================================================================
#  Cirno Reclaim Hybrid - 系统适配档案：ColorOS / realmeUI / OxygenOS（OPlus 底座）
#
#  这个文件只在两种情况下被读取：
#    1. 安装时（音量键选 ColorOS，或自动识别为 ColorOS）；
#    2. WebUI 场景页手动切换档案，或执行 bin/ctl.sh profile apply coloros。
#  平时开机不会读它，也不会覆盖你手改过的参数。
#
#  ColorOS 自带「内存扩展」= zram + 写回存储（hybridswap），
#  由系统进程管理；模块不去重建 zram，也不改系统内存参数，避免和它打架。
# ============================================================================

device_profile=coloros

# 完全不碰系统内存参数：ColorOS 会自己调，改了反而被覆盖或影响调度
vm_tune=0
zram_enable=0
swapfile_enable=0

# 冻结进程先压进 zram（含 ART 堆），还不够才结束进程
reclaim_order=pageout_first
deep_pageout_max_mb=256

interval=15
app_reclaim_interval=45
app_reclaim_cooldown=90
relief_gate=1

# 常用应用 + OPPO / 一加 / realme 自带应用不回收
exclude_packages='com.tencent.mm;com.tencent.mobileqq;com.eg.android.AlipayGphone;com.taobao.taobao;com.jingdong.app.mall;com.ss.android.ugc.aweme;com.oplus.*;com.coloros.*;com.heytap.*;com.oppo.*;com.nearme.*;com.finshell.*'

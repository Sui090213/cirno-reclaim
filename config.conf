# ============================================================================
#  Cirno Reclaim Hybrid - 默认配置
#  v2.3.4：HyperOS / ColorOS 双平台适配 + 低功耗守护
#
#  这个文件不会被当成脚本执行（不 source）。守护进程逐行解析，只认白名单里的键：
#      key=value               （等号两边不要空格）
#      exclude_packages='a;b'  （含分号的名单用单引号包住）
#
#  # 后面是注释；行内注释必须写成「空格 + #」，值中间出现 # 会被判为坏行。
#
#  首次安装默认是「演练模式」（dry_run=1）：只在日志里记录本来会做什么，
#  不换出、不结束任何进程。观察一两天确认没问题后，在 WebUI 场景页关掉演练模式。
#
#  安装后实际生效的是：
#      /data/adb/cirno_reclaim/config.conf
#  它由本文件复制而来，升级模块不会覆盖你改过的值，新增键自动取默认值。
#  系统适配档案（profiles/hyperos.conf、profiles/coloros.conf）只在安装时
#  或 WebUI 里手动切换时覆盖对应参数，平时不会自动改你的设置。
# ============================================================================

# ---------------------------------------------------------------- 通用
enable=1                      # 总开关，0 = 完全停用（守护仍在跑，只是不动作）
dry_run=1                     # 1 = 演练：只写日志，不换出、不杀、不 trim（首刷默认开）
interval=20                   # 守护探测周期（秒）；内存不紧张时还会自动放宽到 60
boot_delay=90                 # 开机后再等多少秒开始工作（守护真的会等）
log_max_kb=512                # 单个日志文件上限，超过后轮转一次
profile=balanced              # 回收强度预设：conservative / balanced / aggressive
device_profile=generic        # 系统适配档案：hyperos / coloros / generic（安装时自动写入）

# ---------------------------------------------------------------- 后台回收
mem_low_mb=800                # 可用内存低于此值触发回收
mem_low_pct=8                 # 同时用总内存百分比兜底，取两者较大值；0 = 只看 mem_low_mb
mem_target_mb=1200            # 本轮回收目标可用内存
mem_target_pct=14             # 目标值也按总内存百分比兜底，取较大值；0 = 关闭
psi_enable=1                  # 用 /proc/pressure/memory 判断真实内存压力
psi_some_avg10=25             # PSI some avg10 超过此值就视为紧张（即使 MemAvailable 还好看）
reclaim_order=pageout_first   # pageout_first = 先页换出（含 ART 堆），不够才结束进程；kill_first = 先结束进程
high_pss_mb=600               # 单个冻结缓存进程 PSS 达到此值就主动处理；0 = 关闭
high_pss_interval=90          # 大进程看门狗检查周期（秒）
max_kills_per_run=4           # 单轮最多结束几个进程；0 = 不限
max_kills_per_hour=20         # 最近 1 小时最多结束几个进程；0 = 不限
max_rounds=4                  # 单轮最多迭代几批（每批之间重新测内存）
cooldown_sec=60               # 两次自动回收的最小间隔
min_process_mb=48             # PSS 小于此值的进程不动
min_frozen_min=5              # 至少冻结多少分钟才允许回收
min_oom_score_adj=900         # 只处理缓存级进程，不要随意调低
only_frozen=1                 # 只回收 cgroup 冻结状态为真的进程
kill_mode=pid                 # pid = 精确结束单进程；am = 结束该包后台进程
protect_foreground=1          # 额外保护当前前台应用
screen_off_only=0             # 1 = 只在息屏时自动回收
drop_caches=0                 # 回收后顺带清页缓存（会影响 IO，默认关闭）
drop_caches_cooldown=1800     # 清页缓存冷却（秒）
deep_reclaim=1                # 页换出：把冻结进程的匿名页压进 zram（进程不死，切回来不冷启动）
deep_pageout_max_mb=192       # 深回收单次页换出上限
allow_system_uid=0            # 允许处理系统 UID；强烈建议保持 0

# ---------------------------------------------------------------- 前台舒缓
app_reclaim=1                 # 启用前台应用内存舒缓
relief_gate=1                 # 1 = 只在内存紧张 / PSI 超标时才舒缓；
                              #     0 = 每个周期都舒缓（内存充裕时做只会让前台回读缺页、白耗电）
app_pss_mb=900                # 前台应用所有进程 PSS 总和阈值；0 = 关闭
app_reclaim_interval=60       # 前台检查周期（秒）
app_reclaim_cooldown=90       # 两次舒缓的冷却（秒）
app_trim_level=RUNNING_LOW    # RUNNING_MODERATE / RUNNING_LOW / RUNNING_CRITICAL
app_trim_all_pids=1           # 对该应用的所有进程都发 trim（不止主进程）
app_pageout=1                 # 用 process_madvise(MADV_PAGEOUT) 换出匿名页（需 helper）
app_pageout_max_mb=192        # 单次舒缓页换出总上限
app_pageout_passes=3          # 分几轮换出（每轮之间重新读 smaps，效果更彻底）
app_proc_reclaim=0            # 尝试 OEM 的 /proc/<pid>/reclaim（默认关闭）

# ---------------------------------------------------------------- 包名过滤
include_packages=''           # 只回收这些包；空 = 全部
# 常用聊天 / 支付 / 购物类默认不回收；OEM 自带应用的排除项在对应档案里追加
exclude_packages='com.tencent.mm;com.tencent.mobileqq;com.eg.android.AlipayGphone;com.taobao.taobao;com.jingdong.app.mall;com.ss.android.ugc.aweme'

# ---------------------------------------------------------------- 内存/虚拟内存调参
# HyperOS 和 ColorOS 都有系统自带的「内存扩展」（zram），由系统自己管理。
# 所以默认不去重建 zram（zram_enable=0），只做 sysctl 级别的调参（vm_tune=1）。
# 想完全不动系统内存参数就把 vm_tune 也设为 0。
vm_tune=1                     # 是否应用 VM 调参
zram_enable=0                 # 接管 zram0（压缩内存盘）；OEM 自管时会被安全跳过
zram_disksize_mb=0            # 0 = 自动（总内存的 50%，上限 6144MB）；>0 表示明确要接管重建
zram_algorithm=lz4            # 首选压缩算法，内核不支持时自动回退
swapfile_enable=0             # 是否额外创建 swapfile（UFS 交换文件，会占用存储）
swapfile_mb=2048              # swapfile 大小
swappiness=80                 # zram 优先时 80~150 都合理
vfs_cache_pressure=100
dirty_writeback_centisecs=1500
dirty_expire_centisecs=500
page_cluster=1
io_tune=0                     # 是否调整块设备 IO 调度器（与内存无关，默认关）
read_ahead_kb=128

# ---------------------------------------------------------------- 保活
keepalive=1                   # 启用看门狗 + 守护自愈
watchdog_interval=30          # 看门狗检查周期（秒）
heartbeat_timeout=180         # 心跳超过这个秒数没更新就判定守护掉线并重启
heartbeat_sec=45              # C++ 守护写心跳的间隔（秒）；越小越灵敏，越大越省电
oom_protect=1                 # 把守护/看门狗的 oom_score_adj 设为 -900，避免被 LMK 杀
daemon_engine=cpp             # 守护引擎：cpp（推荐）/ shell（兼容旧环境，不依赖 C++ 二进制）

# ============================================================================
#  Cirno Reclaim Hybrid - 系统适配档案：HyperOS / MIUI（小米）
#
#  这个文件只在两种情况下被读取：
#    1. 安装时（音量键选 HyperOS，或自动识别为 HyperOS）；
#    2. WebUI 场景页手动切换档案，或执行 bin/ctl.sh profile apply hyperos。
#  平时开机不会读它，也不会覆盖你手改过的参数。
#
#  只写需要覆盖的键，其余沿用 config.conf 的默认值。
#  注意：exclude_packages 是整串覆盖，不是追加。
# ============================================================================

device_profile=hyperos

# HyperOS 的「内存扩展」由系统自己管 zram，这里只做 sysctl 调参
vm_tune=1
zram_enable=0
swapfile_enable=0

# 先压 zram，不够才结束进程：后台应用不必冷启动，开关应用更快
reclaim_order=pageout_first
deep_pageout_max_mb=192

# HyperOS 自己会做前台内存整理，舒缓频率可以放低一些
interval=20
app_reclaim_interval=60
app_reclaim_cooldown=120
relief_gate=1

# 常用应用 + 小米自带应用不回收（HyperOS 杀这些会掉推送 / 掉小窗 / 桌面重载）
exclude_packages='com.tencent.mm;com.tencent.mobileqq;com.eg.android.AlipayGphone;com.taobao.taobao;com.jingdong.app.mall;com.ss.android.ugc.aweme;com.miui.*;com.xiaomi.*;com.mi.*'
